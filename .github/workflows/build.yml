name: Build Android APK

# 1. 触发条件：上传/推送代码到任何分支时自动触发，同时支持在网页端手动点击运行
on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      # 第一步：拉取仓库中的安卓项目代码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 第二步：配置 JDK 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 第三步：配置 Gradle 8.5 环境（自动缓存依赖，且即使网页上传漏掉 gradle-wrapper.jar 也能正常生成）
      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # 第四步：确保 gradlew 存在并赋予可执行权限，运行 ./gradlew assembleDebug 打包 APK
      - name: Build Debug APK with gradlew assembleDebug
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 第五步：将生成的 APK 作为 Artifact 上传到 GitHub 页面底部供直接下载
      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clear6-Pomodoro-v1.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
